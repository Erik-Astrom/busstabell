<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Kommande avgångar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d2230;
    --border: #262c3a;
    --text: #e8ecf3;
    --muted: #8b94a7;
    --accent: #5fb3ff;
    --good: #3ddc97;
    --warn: #ffb454;
    --bad: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  header h1 {
    margin: 0; font-size: 18px; font-weight: 600;
  }
  header h1 .stop {
    color: var(--muted); font-weight: 400; margin-left: 8px;
  }
  .status {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .status.err { color: var(--bad); }
  main { max-width: 900px; margin: 0 auto; padding: 16px 20px 60px; }
  .settings {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
  }
  .settings summary {
    cursor: pointer; color: var(--muted); font-size: 13px;
    list-style: none; user-select: none;
  }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::before { content: "⚙  "; color: var(--accent); }
  .settings .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .settings label {
    display: block; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
  }
  .settings input {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  .settings input:focus { outline: none; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 8px 10px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg);
  }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--panel); }
  tbody td { padding: 12px 10px; vertical-align: middle; }
  .line {
    display: inline-block; min-width: 36px; text-align: center;
    padding: 4px 8px; border-radius: 6px;
    background: var(--panel-2); color: var(--accent);
    font-weight: 600; font-family: var(--mono);
  }
  .line.bus { background: #1d3551; color: #6dc1ff; }
  .line.tram { background: #3a2440; color: #ff8fc7; }
  .line.metro { background: #2c3a1d; color: #b3df6d; }
  .line.train { background: #3a2a1d; color: #ffae6d; }
  .dest { font-weight: 500; }
  .track { color: var(--muted); font-size: 12px; }
  .time {
    font-family: var(--mono); font-size: 14px;
    text-align: right; white-space: nowrap;
  }
  .delay { font-size: 11px; color: var(--muted); }
  .delay.late { color: var(--warn); }
  .delay.early { color: var(--good); }
  .delay.cancelled { color: var(--bad); font-weight: 600; }
  .countdown {
    font-family: var(--mono); font-size: 16px; font-weight: 600;
    text-align: right; min-width: 56px;
  }
  .countdown.soon { color: var(--warn); }
  .countdown.now { color: var(--good); }
  .row.cancelled { opacity: 0.45; text-decoration: line-through; }
  .empty {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  button.refresh {
    background: var(--accent); color: #0a1220; border: none;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-weight: 600; font-size: 13px;
  }
  button.refresh:disabled { opacity: 0.5; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>Kommande avgångar <span class="stop" id="stopName"></span></h1>
  <div style="display:flex; gap:10px; align-items:center">
    <span class="status" id="status">–</span>
    <button class="refresh" id="refresh">Uppdatera</button>
  </div>
</header>

<main>
  <details class="settings" id="settings">
    <summary>Inställningar</summary>
    <div class="grid">
      <div>
        <label for="stopId">Hållplats-ID</label>
        <input id="stopId" type="text" inputmode="numeric">
      </div>
      <div>
        <label for="apiKey">API-nyckel</label>
        <input id="apiKey" type="password" autocomplete="off">
      </div>
      <div>
        <label for="interval">Auto-uppdatering (sek)</label>
        <input id="interval" type="number" min="10" step="5">
      </div>
    </div>
  </details>

  <table>
    <thead>
      <tr>
        <th>Linje</th>
        <th>Destination</th>
        <th style="text-align:right">Tid</th>
        <th style="text-align:right">Om</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="4" class="empty">Laddar…</td></tr>
    </tbody>
  </table>
</main>

<script>
const LS = {
  apiKey: 'trafiklab_key',
  stopId: 'trafiklab_stop',
  interval: 'trafiklab_interval',
};
const $ = id => document.getElementById(id);
const stopInput = $('stopId');
const keyInput = $('apiKey');
const intervalInput = $('interval');

// Ordning: serverns /config.json (satt i .env på VPS:en, funkar på alla
// enheter direkt) → localStorage (egen override) → inbyggda värden.
async function loadConfig() {
  let server = {};
  try {
    const r = await fetch('config.json', { cache: 'no-store' });
    if (r.ok) server = await r.json();
  } catch (e) {}
  stopInput.value =
    localStorage.getItem(LS.stopId) || server.stop || '740069150';
  keyInput.value = localStorage.getItem(LS.apiKey) || server.key || '';
  intervalInput.value =
    localStorage.getItem(LS.interval) || server.interval || '30';
}

[stopInput, keyInput, intervalInput].forEach(el =>
  el.addEventListener('change', () => {
    localStorage.setItem(LS.stopId,   stopInput.value.trim());
    localStorage.setItem(LS.apiKey,   keyInput.value.trim());
    localStorage.setItem(LS.interval, intervalInput.value || '30');
    scheduleRefresh();
    fetchDepartures();
  })
);

$('refresh').addEventListener('click', fetchDepartures);

function setStatus(msg, isErr=false) {
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('err', isErr);
}

function modeClass(routeType) {
  // GTFS route_type mapping (rough)
  if (routeType === 0 || routeType === 900) return 'tram';
  if (routeType === 1 || routeType === 401) return 'metro';
  if (routeType === 2 || (routeType >= 100 && routeType < 200)) return 'train';
  return 'bus';
}

function fmtTime(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
}

function fmtCountdown(iso) {
  if (!iso) return '';
  const ms = new Date(iso) - new Date();
  const m = Math.round(ms / 60000);
  if (m <= 0) return 'nu';
  if (m < 60) return m + ' min';
  return Math.floor(m/60) + 't ' + (m%60) + 'm';
}

function delayInfo(scheduled, realtime) {
  if (!scheduled || !realtime) return { text: '', cls: '' };
  const diff = Math.round((new Date(realtime) - new Date(scheduled)) / 60000);
  if (diff === 0)  return { text: 'i tid',          cls: '' };
  if (diff > 0)    return { text: '+' + diff + ' min', cls: 'late' };
  return            { text: diff + ' min',           cls: 'early' };
}

function render(data) {
  const tbody = $('rows');
  const departures = data.departures || [];

  // Sort by realtime || scheduled
  departures.sort((a, b) => {
    const ta = new Date(a.realtime || a.scheduled);
    const tb = new Date(b.realtime || b.scheduled);
    return ta - tb;
  });

  if (departures.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Inga avgångar inom 60 minuter.</td></tr>';
    return;
  }

  // Update stop name from first departure if available
  if (data.stop && data.stop.name) {
    $('stopName').textContent = '· ' + data.stop.name;
  } else if (departures[0]?.stop?.name) {
    $('stopName').textContent = '· ' + departures[0].stop.name;
  }

  tbody.innerHTML = departures.map(d => {
    const route   = d.route || {};
    const trip    = d.trip || {};
    const cls     = modeClass(route.transport_mode_code ?? route.route_type);
    const line    = route.designation || route.name || '–';
    const dest    = route.direction
                 || route.destination?.name
                 || trip.direction
                 || trip.headsign
                 || '–';
    const track   = d.scheduled_track || d.realtime_track || '';
    const sched   = d.scheduled;
    const real    = d.realtime;
    const delay   = delayInfo(sched, real);
    const display = real || sched;
    const cd      = fmtCountdown(display);
    const cdCls   = (cd === 'nu') ? 'now' : (cd.endsWith(' min') && parseInt(cd) <= 5) ? 'soon' : '';
    const cancelled = d.canceled || d.is_cancelled;

    return `
      <tr class="row ${cancelled ? 'cancelled' : ''}">
        <td><span class="line ${cls}">${escapeHtml(line)}</span></td>
        <td>
          <div class="dest">${escapeHtml(dest)}</div>
          ${track ? `<div class="track">Läge ${escapeHtml(track)}</div>` : ''}
        </td>
        <td class="time">
          ${fmtTime(display)}
          <div class="delay ${delay.cls} ${cancelled ? 'cancelled' : ''}">
            ${cancelled ? 'INSTÄLLD' : delay.text}
          </div>
        </td>
        <td class="countdown ${cdCls}">${cd}</td>
      </tr>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

let lastData = null;
let timer = null;
function scheduleRefresh() {
  if (timer) clearInterval(timer);
  const sec = Math.max(10, parseInt(intervalInput.value, 10) || 30);
  timer = setInterval(fetchDepartures, sec * 1000);
}

async function fetchDepartures() {
  const key  = keyInput.value.trim();
  const stop = stopInput.value.trim();
  if (!key)  { setStatus('Saknar API-nyckel — öppna inställningar.', true); return; }
  if (!stop) { setStatus('Saknar hållplats-ID.', true); return; }

  const btn = $('refresh');
  btn.disabled = true;
  setStatus('Hämtar…');
  try {
    const url = `https://realtime-api.trafiklab.se/v1/departures/${encodeURIComponent(stop)}?key=${encodeURIComponent(key)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    lastData = data;
    render(data);
    setStatus('Senast uppdaterad ' + new Date().toLocaleTimeString('sv-SE'));
  } catch (err) {
    setStatus('Fel: ' + err.message, true);
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

loadConfig().then(() => {
  scheduleRefresh();
  fetchDepartures();
});

// Räkna ned live var 10:e sekund utan att hämta om (renderar från cachen).
setInterval(() => { if (lastData) render(lastData); }, 10000);

// Hämta om direkt när fliken blir aktiv igen.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchDepartures();
});
</script>
</body>
</html>
