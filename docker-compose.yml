# Körs på Hetzner-VPS:en tillsammans med de andra sajterna.
#   docker compose up -d --build
#
# Kant-Caddyn (i jaghjalpermigsjalv-stacken) terminerar TLS och proxar
# busstabell.jaghjalpermigsjalv.com -> denna container via det delade
# nätverket "web". Skapa nätverket en gång:  docker network create web
#
# ~/busstabell/.env på VPS:en (ej i git) — sätts EN gång:
#   TRAFIKLAB_KEY=din-nyckel-fran-trafiklab
#   TRAFIKLAB_STOP=740069150

services:
  busstabell:
    build: .
    container_name: busstabell
    restart: unless-stopped
    environment:
      TZ: Europe/Stockholm
      TRAFIKLAB_KEY: ${TRAFIKLAB_KEY:-}
      TRAFIKLAB_STOP: ${TRAFIKLAB_STOP:-740069150}
      TRAFIKLAB_INTERVAL: ${TRAFIKLAB_INTERVAL:-30}
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    external: true
